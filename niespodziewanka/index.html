<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Znajdź wszystkie ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111318;
            color: #fff;
        }

        .container {
            width: min(900px, calc(100% - 30px));
            margin: 0 auto;
            padding: 35px 0 60px;
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .progress-info {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .progress {
            width: 100%;
            height: 12px;
            background: #292d36;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff4d7d, #ff799f);
            transition: width 0.3s ease;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .item {
            position: relative;
            min-height: 90px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 32px;

            background: #1b1f27;
            border: 2px solid #2b303b;
            border-radius: 15px;

            cursor: pointer;
            user-select: none;

            transition:
                transform 0.15s ease,
                background 0.2s ease,
                opacity 0.2s ease,
                border-color 0.2s ease;
        }

        .item:hover {
            transform: translateY(-2px);
            border-color: #555d6c;
        }

        .item:active {
            transform: scale(0.96);
        }

        .item.done {
            opacity: 0.35;
            background: #15171c;
            border-color: #292c33;
        }

        .item.done::after {
            content: "";
            position: absolute;

            width: 75%;
            height: 3px;

            background: #ff4d7d;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%) rotate(-10deg);

            border-radius: 5px;
        }

        .complete {
            display: none;

            margin-top: 30px;
            padding: 25px;

            text-align: center;

            background: #1b1f27;
            border: 2px solid #ff4d7d;
            border-radius: 15px;

            font-size: 22px;
        }

        .complete.show {
            display: block;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            color: #777;
            font-size: 12px;
        }

        @media (max-width: 650px) {
            .container {
                width: min(100% - 20px, 900px);
                padding-top: 25px;
            }

            h1 {
                font-size: 27px;
            }

            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 9px;
            }

            .item {
                min-height: 78px;
                font-size: 27px;
            }
        }

        @media (max-width: 380px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Znajdź wszystkie ❤️</h1>

    <div class="subtitle">
        Podpowiedzi są bliżej, niż myślisz 👀
    </div>

    <div class="progress-info">
        Znalezione: <span id="found">0</span> / <span id="total">40</span>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="complete" id="complete">
        ❤️ Znalazłaś wszystkie! ❤️
        <br><br>
        Kocham Cię 🥰
    </div>

    <div id="status">
        Łączenie...
    </div>

</div>


<script>
const API_URL = "https://pskpdf.pl/api/api.php";
const items = [
    "👓🎮",
    "🫧👕",
    "🪞",
    "❄️🍔",
    "🧊🥶",
    "🍲⚡",
    "🔥🍕",
    "💧",
    "☕🐶",
    "🍽️",
    "🍳",
    "🛹🔪",
    "🚪🍬",
    "🗑️🤢",
    "🫧🍽️",
    "🪑",
    "📺🎛️",
    "📺👀",
    "⌨️",
    "🧂",
    "🔌🔋",
    "📶🌐",
    "🪦🐶",
    "👕🚪",
    "🧦",
    "👟",
    "👕🧺",
    "🛏️❤️",
    "💡🌙",
    "🚿💦",
    "🚽💩",
    "💄👜",
    "🌸👃",
    "💇‍♀️🪮",
    "⚖️",
    "🚪",
    "🪟",
    "🪴",
    "🧹⚡",
    "🌵🫙"
];

let state = new Array(items.length).fill(false);

const grid = document.getElementById("grid");
const foundElement = document.getElementById("found");
const totalElement = document.getElementById("total");
const progressBar = document.getElementById("progressBar");
const completeElement = document.getElementById("complete");
const statusElement = document.getElementById("status");

totalElement.textContent = items.length;


/* =========================
   TWORZENIE KAFELKÓW
========================= */

function createGrid() {

    grid.innerHTML = "";

    items.forEach((emoji, index) => {

        const div = document.createElement("div");

        div.className = "item";
        div.textContent = emoji;
        div.dataset.index = index;

        div.addEventListener("click", () => {
            toggleItem(index);
        });

        grid.appendChild(div);
    });

}


/* =========================
   RYSOWANIE STANU
========================= */

function render() {

    const elements = document.querySelectorAll(".item");

    elements.forEach((element, index) => {

        if (state[index]) {
            element.classList.add("done");
        } else {
            element.classList.remove("done");
        }

    });

    const found = state.filter(Boolean).length;

    foundElement.textContent = found;

    const percentage = (found / items.length) * 100;

    progressBar.style.width = percentage + "%";

    if (found === items.length) {
        completeElement.classList.add("show");
    } else {
        completeElement.classList.remove("show");
    }

}


/* =========================
   POBIERANIE STANU
========================= */

async function loadState() {

    try {

        const response = await fetch(
            API_URL + "?action=get&t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (Array.isArray(data.state)) {

            state = items.map((_, index) => {
                return Boolean(data.state[index]);
            });

            render();
        }

        statusElement.textContent = "Połączono ❤️";

    } catch (error) {

        console.error(error);

        statusElement.textContent =
            "Brak połączenia z serwerem";

    }

}


/* =========================
   ZAZNACZANIE
========================= */

async function toggleItem(index) {

    /*
     * Aktualizujemy lokalnie od razu,
     * żeby kliknięcie było natychmiastowe.
     */

    const oldValue = state[index];

    state[index] = !state[index];

    render();

    try {

        const response = await fetch(API_URL + "?action=toggle", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                index: index
            })

        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (Array.isArray(data.state)) {

            state = items.map((_, index) => {
                return Boolean(data.state[index]);
            });

            render();

        }

    } catch (error) {

        console.error(error);

        /*
         * Jeżeli zapis się nie udał,
         * cofamy lokalną zmianę.
         */

        state[index] = oldValue;

        render();

        statusElement.textContent =
            "Nie udało się zapisać 😢";

    }

}


/* =========================
   START
========================= */

createGrid();
loadState();

/*
 * Synchronizacja między telefonami.
 * Co sekundę sprawdzamy stan.
 */

setInterval(loadState, 1000);

</script>

</body>
</html>
