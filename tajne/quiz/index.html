<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8"><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d32">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>

    <link rel="stylesheet" href="style.css">

    <!-- PapaParse do wczytywania CSV -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>

<header>
<div class="header-title">

    <h1>📚 Quiz</h1>

    <div class="header-buttons">

        <button id="test-btn">
            🎲
        </button>

        <button id="reset-btn">
            🔄
        </button>

    </div>

</div>
    <div id="score">
        Wynik: <span id="correct">0</span> / <span id="total">0</span>
        <br>

        📘 <span id="cat1">0</span> |
        🐮 <span id="cat2">0</span> |
        🦄 <span id="cat3">0</span>
    
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="progress-text">0/0</div>
    </div>

</header>

<main id="quiz"></main>

<!-- TRYB TESTOWY -->

<div id="test-modal" class="hidden">

    <div class="test-box">

        <h2>🎲 Tryb testowy</h2>


        <p>Wybierz kategorię:</p>


        <div class="category-buttons">

            <button class="test-category" data-category="1">
                📘 Ogólne
            </button>

            <button class="test-category" data-category="2">
                🐮 Rolnictwo
            </button>

            <button class="test-category" data-category="3">
                🦄 Bajki
            </button>

        </div>


        <p>Liczba pytań:</p>


        <div class="amount-buttons">

            <button class="test-amount" data-amount="10">
                10
            </button>

            <button class="test-amount" data-amount="20">
                20
            </button>

            <button class="test-amount" data-amount="0">
                Wszystkie
            </button>

        </div>


        <button id="start-test-btn">
            ▶ Rozpocznij
        </button>


        <button id="close-test-btn">
            ❌ Zamknij
        </button>


    </div>

</div>



<!-- EKRAN TESTU -->

<div id="test-screen" class="hidden">

    <div class="test-container">

        <div id="test-progress">
            Pytanie 0/0
        </div>


        <div id="test-question"></div>


        <div id="test-answers"></div>


    </div>

</div>

<script src="script.js"></script>
<script src="test.js"></script>

</body>
</html>
